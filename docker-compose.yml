services:
  # ==========================================
  # PostgreSQL 18 Database Service
  # ==========================================
  postgres:
    image: postgres:18-alpine
    container_name: autonomous-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-autonomous}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autonomous_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-autonomous_db}
      PGDATA: /var/lib/postgresql/data
    volumes:
      # PostgreSQL 18 volume target
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    shm_size: 256mb
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autonomous} -d ${DB_NAME:-autonomous_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autonomous-network

  # ==========================================
  # Redis Cache & Queue (BullMQ) Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: autonomous-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - autonomous-network

  # ==========================================
  # Autonomous API (NestJS + Prisma 7)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: autonomous-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-autonomous}:${DB_PASSWORD:-autonomous_secure_pass_2026}@postgres:5432/${DB_NAME:-autonomous_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - autonomous-network

  # ==========================================
  # Nginx Reverse Proxy & Load Balancer
  # ==========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: autonomous-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - autonomous-network

# ==========================================
# Named Volumes & Networks
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  autonomous-network:
    driver: bridge
